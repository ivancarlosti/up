<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Up - minimalista, cluster ready uptime monitoring" />
    <title>Up</title>
    <script>
      // Apply the persisted theme and the text direction before the first paint
      // so the UI never flashes the wrong palette or a left to right layout in a
      // right to left language. The translated strings are handled by vue-i18n
      // once the application boots.
      (function () {
        try {
          var stored = localStorage.getItem('up.theme')
          var mode = stored || 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = mode

          var locale = localStorage.getItem('up.locale') || ''
          var base = locale.split('-')[0].toLowerCase()
          var rtl = ['ar', 'fa', 'he', 'ur'].indexOf(base) !== -1
          // Keep lang and dir consistent: the Tailwind ltr:/rtl: variants match
          // on :lang() or [dir], so a stale lang could select the opposite rule.
          if (locale) document.documentElement.lang = locale
          document.documentElement.dir = rtl ? 'rtl' : 'ltr'
        } catch (error) {
          /* private mode: fall back to the system preference */
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-BiUSVIne.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/utils-vKijObja.js">
    <link rel="modulepreload" crossorigin href="/assets/i18n-5ule3R0f.js">
    <link rel="modulepreload" crossorigin href="/assets/format-DPXVpUlp.js">
    <link rel="stylesheet" crossorigin href="/assets/index-4T7pqWlf.css">
  </head>
  <body>
    <div id="app"></div>
    <!--
      The inline splash covers the window from the first paint until the bundle
      has parsed, so a start never shows a blank page (the SPA used to render
      nothing until the API answered). Vue does not clear what is already on the
      page, so src/main.ts removes this element before mounting; the in app boot
      screen (views/BootView.vue) takes over from there.
    -->
    <div id="up-splash">
      <div class="up-splash__spinner"></div>
      <p class="up-splash__title">Up</p>
      <p class="up-splash__hint">Loading the interface…</p>
    </div>
    <style>#up-splash{z-index:50;color:#0f172a;background:#fff;flex-direction:column;justify-content:center;align-items:center;gap:.5rem;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;display:flex;position:fixed;inset:0}html.dark #up-splash{color:#e2e8f0;background:#020617}#up-splash .up-splash__spinner{opacity:.75;border:3px solid;border-top-color:#0000;border-radius:9999px;width:1.75rem;height:1.75rem;animation:.9s linear infinite up-splash-spin}#up-splash .up-splash__title{margin:0;font-size:.875rem;font-weight:600}#up-splash .up-splash__hint{opacity:.6;margin:0;font-size:.75rem}@keyframes up-splash-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#up-splash .up-splash__spinner{animation:none}}</style>
  </body>
</html>
