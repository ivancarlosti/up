<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Up - minimalista, cluster ready uptime monitoring" />
    <title>Up</title>
    <script>
      // Apply the persisted theme before the first paint so the UI never
      // flashes the wrong palette. The locale is handled by vue-i18n once the
      // application boots.
      (function () {
        try {
          var stored = localStorage.getItem('up.theme')
          var mode = stored || 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = mode
        } catch (error) {
          /* private mode: fall back to the system preference */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
