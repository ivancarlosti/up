# ---------------------------------------------------------------------------
# Up - Docker Compose
#
# The container connects to an EXTERNAL MariaDB/MySQL server through the
# special "host.docker.internal" hostname (enabled by extra_hosts below), so
# this file intentionally declares NO database service: the database always
# lives outside of the container (host machine, another server or a managed
# service).
#
# Quick start:
#   cp docker/.env.example docker/.env    # then edit the credentials
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f up
# ---------------------------------------------------------------------------

services:
  up:
    image: ghcr.io/ivancarlosti/up:latest
    container_name: up
    # Loads docker/.env into the container environment (path is relative to
    # this compose file).
    env_file: .env
    # Host port -> container port.
    #
    #   APP_PORT  = port the HTTP server listens on INSIDE the container
    #               (it comes from docker/.env, which Compose also uses to
    #               interpolate this file: the project directory of
    #               `docker compose -f docker/docker-compose.yml ...` is this
    #               docker/ folder, so the same .env feeds both the container
    #               environment and the interpolation below).
    #   HOST_PORT = optional published port on the Docker host, defaults to
    #               APP_PORT. Set it only when the outer port must differ, for
    #               example APP_PORT=3000 with HOST_PORT=80.
    #
    # Defaults: no .env value -> 3000:3000 (identical to a plain APP_PORT=3000),
    # APP_PORT=8080 -> 8080:8080, APP_PORT=3000 + HOST_PORT=80 -> 80:3000.
    #
    # On a Compose version that does not support nested defaults, replace the
    # line below with: "${APP_PORT:-3000}:${APP_PORT:-3000}"
    ports:
      - "${HOST_PORT:-${APP_PORT:-3000}}:${APP_PORT:-3000}"
    # Makes the Docker host reachable from inside the container as
    # host.docker.internal. This is what the default DB_HOST points to.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
